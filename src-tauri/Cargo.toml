[package]
name = "fincal"
version = "0.6.0"
description = "FinCal: финансовый календарь"
edition = "2021"

[lib]
name = "fincal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }

# Touch ID: системный фреймворк LocalAuthentication напрямую, без плагинов.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSError", "NSString"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LABiometryType"] }

[dev-dependencies]
serde_json = "1"
