[package]
name = "fincal"
version = "0.2.0"
description = "FinCal: финансовый календарь"
edition = "2021"

[lib]
name = "fincal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
